name: Phase 3B constraints

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-environment:
    name: Constrained install and synthetic smoke (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints/phase3b-ci.txt
      - name: Install constrained core and development dependencies
        run: >-
          python -m pip install -e ".[dev]"
          -r requirements.txt -c constraints/phase3b-ci.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Print public-safe environment report
        run: python scripts/print_environment_report.py
      - name: Run Phase 3B synthetic projection smoke
        run: >-
          python scripts/run_phase3b_projection_smoke.py
          --out outputs/phase3b_constraints_smoke --seed 0
