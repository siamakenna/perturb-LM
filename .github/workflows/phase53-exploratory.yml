name: Phase 5.3 exploratory software

on:
  pull_request:
    paths:
      - 'research/phase5_3_exploratory/**'
      - '.github/workflows/phase53-exploratory.yml'
  push:
    branches: ['science/phase5-3-exploratory-*']
    paths:
      - 'research/phase5_3_exploratory/**'
      - '.github/workflows/phase53-exploratory.yml'

permissions:
  contents: read

jobs:
  invented-data-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical and plotting software only
        run: python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 matplotlib==3.10.8
      - name: Test invented data without fetching profiles
        run: python -m unittest discover -s research/phase5_3_exploratory -p 'test_*.py' -v
